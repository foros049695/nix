name: Publish Nix pilot downloads

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Nix pilot builds run on main
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency: publish-pilot

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PILOT_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Download and verify packages from the main pilot workflow
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PILOT_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GH_REPO/actions/workflows/pilot-builds.yml/runs?branch=main&status=success" --paginate --jq ".workflow_runs[] | select(.id == $PILOT_RUN_ID)")
          test -n "$run"
          sha=$(jq -er --arg repo "$GH_REPO" 'select(.head_repository.full_name == $repo) | .head_sha' <<< "$run")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "PILOT_SHA=$sha" >> "$GITHUB_ENV"
          gh run download "$PILOT_RUN_ID" --dir packages \
            --name nix-windows-x64-pilot --name nix-linux-x86_64-pilot \
            --name nix-android-pilot-arm64 --name nix-android-pilot-armv7
          for directory in packages/*; do
            (cd "$directory" && sha256sum --check ./*.sha256)
          done
      - name: Publish prerelease and direct downloads
        shell: bash
        run: |
          set -euo pipefail
          tag="pilot-${PILOT_SHA:0:7}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*/*
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release create "$tag" packages/*/* --target "$PILOT_SHA" \
              --prerelease --latest=false --title "Nix piloto ${PILOT_SHA:0:7}" \
              --notes "Pacotes de teste para Windows x64, Linux x86_64 e Android ARM64/ARMv7. Os arquivos SHA-256 acompanham os pacotes."
          fi
