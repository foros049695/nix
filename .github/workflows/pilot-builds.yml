name: Nix pilot builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/nix_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Build Linux x86_64
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev
          flutter pub get
          flutter build linux --release
          tar -czf nix-linux-x86_64-pilot.tar.gz -C build/linux/x64/release bundle
          sha256sum nix-linux-x86_64-pilot.tar.gz > nix-linux-x86_64-pilot.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-linux-x86_64-pilot
          path: |
            apps/nix_client/nix-linux-x86_64-pilot.tar.gz
            apps/nix_client/nix-linux-x86_64-pilot.sha256
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/nix_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Build Android pilot APKs
        env:
          NIX_ANDROID_PILOT: 'true'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "nix-android-pilot-$abi.apk"
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "nix-android-pilot-$abi.apk"
            sha256sum "nix-android-pilot-$abi.apk" > "nix-android-pilot-$abi.sha256"
            wc -c "nix-android-pilot-$abi.apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-android-pilot-arm64
          path: |
            apps/nix_client/nix-android-pilot-arm64-v8a.apk
            apps/nix_client/nix-android-pilot-arm64-v8a.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-android-pilot-armv7
          path: |
            apps/nix_client/nix-android-pilot-armeabi-v7a.apk
            apps/nix_client/nix-android-pilot-armeabi-v7a.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/nix_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $triplet = 'x64-windows-static-md'
          vcpkg install "openssl:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OPENSSL_ROOT_DIR = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          flutter config --enable-windows-desktop --no-analytics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = (Resolve-Path 'build/windows/x64/runner/Release').Path
          if (!(Test-Path "$release/nix_client.exe") -or !(Test-Path "$release/sqlite3.dll")) {
            throw 'O bundle está sem o executável do Nix ou a DLL do SQLCipher.'
          }
          $env:PATH = "$release;$env:PATH"
          $env:NIX_TEST_WINDOWS_SQLCIPHER = 'true'
          flutter test --no-pub test/windows_credential_storage_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $torVersion = '16.0.1'
          $torAsset = "tor-expert-bundle-windows-x86_64-$torVersion.tar.gz"
          $torHash = '9eed3c3ff1fe43df034ce360196c9ec95472560d77ff55614d0cd5120edea27b'
          $archive = Join-Path $env:RUNNER_TEMP $torAsset
          Invoke-WebRequest "https://dist.torproject.org/torbrowser/$torVersion/$torAsset" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $torHash) {
            throw 'O Tor Expert Bundle não corresponde ao artefato verificado.'
          }
          $extract = Join-Path $env:RUNNER_TEMP 'nix-tor-expert'
          New-Item -ItemType Directory -Path $extract | Out-Null
          tar -xzf $archive -C $extract 'tor/tor.exe' docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$extract/tor" "$release/tor" -Recurse
          Copy-Item "$extract/docs" "$release/tor/licenses" -Recurse
          & "$release/tor/tor.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath "$release/nix_client.exe" -WorkingDirectory $release -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "Nix encerrou no teste de abertura com código $($app.ExitCode)." }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
          Copy-Item ../../LICENSE "$release/LICENSE.txt"
          Compress-Archive -Path "$release/*" -DestinationPath nix-windows-x64-pilot.zip
          $hash = (Get-FileHash nix-windows-x64-pilot.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nix-windows-x64-pilot.zip" | Set-Content -Encoding ascii nix-windows-x64-pilot.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-windows-x64-pilot
          path: |
            apps/nix_client/nix-windows-x64-pilot.zip
            apps/nix_client/nix-windows-x64-pilot.sha256
          if-no-files-found: error
