name: Nix pilot builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/nix_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Build Linux x86_64
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev
          flutter pub get
          flutter build linux --release
          tar -czf nix-linux-x86_64-pilot.tar.gz -C build/linux/x64/release bundle
          sha256sum nix-linux-x86_64-pilot.tar.gz > nix-linux-x86_64-pilot.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-linux-x86_64-pilot
          path: |
            apps/nix_client/nix-linux-x86_64-pilot.tar.gz
            apps/nix_client/nix-linux-x86_64-pilot.sha256
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/nix_client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - name: Build Android test APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk nix-android-pilot-debug.apk
          sha256sum nix-android-pilot-debug.apk > nix-android-pilot-debug.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nix-android-pilot-debug
          path: |
            apps/nix_client/nix-android-pilot-debug.apk
            apps/nix_client/nix-android-pilot-debug.sha256
          if-no-files-found: error
