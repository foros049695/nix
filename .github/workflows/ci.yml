name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy-and-lint:
    name: Privacy & Security Gate Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify Privacy Rules
        run: |
          chmod +x scripts/verify_privacy_matrix.sh
          ./scripts/verify_privacy_matrix.sh

      - name: Verify Automation Policy (Decommissioned 4-Hour Maintenance)
        run: |
          chmod +x scripts/verify_automation_policy.sh
          ./scripts/verify_automation_policy.sh

  relay-go:
    name: Relay Go Lint & Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          check-latest: true
          cache-dependency-path: services/nix_relay/go.sum

      - name: Test Relay
        working-directory: services/nix_relay
        run: |
          go vet ./...
          go test -v -race ./...

  core-crypto:
    name: Core Crypto Dart Analyze & Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Analyze & Test Core Crypto
        working-directory: modules/core_crypto
        run: |
          dart pub get
          dart analyze
          dart test

  transport:
    name: Transport Dart Analyze & Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Analyze & Test Transport
        working-directory: modules/transport
        run: |
          dart pub get
          dart analyze
          dart test

  client-flutter:
    name: Flutter Client Analyze & Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Analyze & Test Client
        working-directory: apps/nix_client
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
