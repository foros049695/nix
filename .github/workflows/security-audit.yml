name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Toda segunda-feira
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret & Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
