name: Scheduled 4-Hour Maintenance & Security Audit

on:
  schedule:
    # Executa a cada 4 horas (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-maintenance-audit
  cancel-in-progress: false

jobs:
  maintenance-audit:
    name: 4-Hour Monorepo Maintenance & Audit
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.23'
          check-latest: true
          cache-dependency-path: services/nix_relay/go.sum

      - name: Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Dependencies Across Monorepo
        run: |
          cd modules/core_crypto && dart pub get
          cd ../transport && dart pub get
          cd ../../apps/nix_client && flutter pub get
          cd ../../services/nix_relay && go mod download

      - name: Execute Automated Audit Suite & Generate Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x scripts/run_maintenance_audit.py
          python3 scripts/run_maintenance_audit.py

      - name: Persist Maintenance Report and History
        run: |
          git config user.name "nix-security-bot"
          git config user.email "security-bot@nix.local"
          git add docs/automation/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos relatórios de auditoria."
          else
            git commit -m "chore(audit): update 4-hour automated maintenance report [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Não foi possível enviar commit de auditoria automaticamente."
          fi

      - name: Upload Audit Report Artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: maintenance-audit-report
          path: docs/automation/
          retention-days: 30
