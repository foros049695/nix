name: nix_core_crypto
description: >-
  Primitivas criptográficas do Project Nix (identidade Ed25519/X25519,
  envelopes XChaCha20-Poly1305, Argon2id, X3DH, Double Ratchet e registros
  assinados), construídas sobre o pacote `cryptography`.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cryptography: ^2.7.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
