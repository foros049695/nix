name: nix_client
description: "Cliente soberano e seguro do Projeto Nix — Mensageria E2EE, Archive, Media e Wallet XMR."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.8
  ffi: ^2.1.3
  protobuf: ^3.1.0
  provider: ^6.1.2
  crypto: ^3.0.3
  cryptography: ^2.7.0
  nix_core_crypto:
    path: ../../modules/core_crypto
  nix_transport:
    path: ../../modules/transport
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/brand/
    - assets/migrations/
    - assets/catalog/
