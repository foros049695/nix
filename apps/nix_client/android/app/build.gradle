plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.projetonix.nix_client"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.projetonix.nix_client"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        jniLibs {
            // Obrigatório no Android 10+ (API 29+) para extrair libtor.so em nativeLibraryDir
            // com permissão de execução SELinux (W^X).
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        release {
            def storePath = System.getenv("NIX_KEYSTORE_PATH") ?: keystoreProperties['storeFile']
            def storePass = System.getenv("NIX_KEYSTORE_PASSWORD") ?: keystoreProperties['storePassword']
            def keyAliasVal = System.getenv("NIX_KEY_ALIAS") ?: keystoreProperties['keyAlias']
            def keyPass = System.getenv("NIX_KEY_PASSWORD") ?: keystoreProperties['keyPassword']

            if (storePath && storePass && keyAliasVal && keyPass) {
                def keyFile = file(storePath).exists() ? file(storePath) : rootProject.file(storePath)
                if (keyFile.isFile()) {
                    storeFile keyFile
                    storePassword storePass
                    keyAlias keyAliasVal
                    keyPassword keyPass
                }
            }
        }
    }

    buildTypes {
        release {
            // Configuração protegida de release: rejeita debug keystore para distribuição
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig null
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['validateSigningRelease', 'packageRelease', 'packageReleaseBundle']) {
        task.doFirst {
            if (android.signingConfigs.release.storeFile == null) {
                throw new GradleException("Configure a keystore release usando key.properties ou NIX_KEYSTORE_PATH, NIX_KEYSTORE_PASSWORD, NIX_KEY_ALIAS e NIX_KEY_PASSWORD.")
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    // Binário Tor oficial pré-compilado (arm64-v8a, armeabi-v7a, x86, x86_64 -> libtor.so)
    implementation "info.guardianproject:tor-android:0.4.8.17.2"
}

flutter {
    source = "../.."
}
