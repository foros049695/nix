plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.projetonix.nix_client"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.projetonix.nix_client"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    packagingOptions {
        jniLibs {
            // Obrigatório no Android 10+ (API 29+) para extrair libtor.so em nativeLibraryDir
            // com permissão de execução SELinux (W^X).
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            // Assinatura de desenvolvimento para testes em dispositivos físicos;
            // substitua por keystore dedicada de release antes de distribuição pública.
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    // Binário Tor oficial pré-compilado (arm64-v8a, armeabi-v7a, x86, x86_64 -> libtor.so)
    implementation "info.guardianproject:tor-android:0.4.8.17.2"
}

flutter {
    source = "../.."
}
